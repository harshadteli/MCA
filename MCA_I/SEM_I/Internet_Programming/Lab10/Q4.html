<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode</title>

    <style>

        body {
            background-color: white;
            color: black;
            text-align: center;
        }

        .dark {
            background-color: black;
            color: white;
        }

    </style>

</head>
<body>

    <h2>Dark Mode Toggle</h2>

    <p>Click the button to change the theme.</p>

    <button onclick="changeMode()">Toggle Dark Mode</button>

    <script>

        function changeMode() {

            document.body.classList.toggle("dark");

        }

    </script>

</body>
</html>
