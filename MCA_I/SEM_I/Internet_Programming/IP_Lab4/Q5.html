<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Q5. Online Course Registration Form
Create an Online Course Registration Form using only HTML form elements. The form should contain:
    • Full Name – Text box 
    • Username – Text box 
    • Password – Password input 
    • Email – Email input 
    • Mobile Number – Number input 
    • Date of Birth – Date input 
    • Gender – Radio buttons (Male/Female) 
    • Select Course – Checkboxes (HTML, CSS, JavaScript, Python) 
    • Upload Certificate – File input 
    • Preferred Color – Color input 
    • Submit Form button 
    • Reset Form button 
Use suitable HTML input types for each field. Do not use CSS or JavaScript. -->

</head>

<body>
    <h2>Online Course Registration Form</h2>
    <form action="">
        <label for="fname">Full Name:</label>
        <input type="text"><br>
        <label for="uname">User Name:</label>
        <input type="text"><br>
        <label for="password">Password:</label>
        <input type="password"><br>
        <label for="email">Email:</label>
        <input type="email"><br>
        <label for="mnumber">Mobile Number:</label>
        <input type="number"><br>
        <label for="dob">DOB:</label>
        <input type="date"><br>
        <label for="gender">Gender:</label>
        <input type="radio" name="Male" value="Male">Male
        <input type="radio" name="Female" value="Female">Female<br>
        <label for="courses">Select Courses:</label>
        <input type="checkbox" name="HTML" value="HTML">HTML
        <input type="checkbox" name="CSS" value="CSS">CSS
        <input type="checkbox" name="JAVASCRIPT" value="JAVASCRIPT">JAVASCRIPT
        <br><label for="certificate">Upload Certificate:</label>
        <input type="file"><br>
        <input type="color"><br>
        <input type="submit" value="Submit">
        <input type="Reset" value="Reset">




    </form>

</body>

</html>
