<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Navigation</title>
</head>
<body>
    <button onclick="goToGoogle()">Go To Google</button><br>
    <div id="result"></div>
    <script type="text/javascript">
        function goToGoogle(){
            let choice=confirm("Do you really want to leave this page");
        if(choice){
            window.location.href="https://www.gooogle.com";
        }else{
            document.getElementById("result").innerText="Stayed on this Page";
        }
        }
    </script>
</body>
</html>
