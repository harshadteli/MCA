<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator using Arrow functions</title>
</head>

<body>
    <script type="text/javascript">
        let add = (a, b) => a + b;
        let sub= (a, b) => a - b;
        let mul = (a, b) => a * b;
        let div = (a, b) => a / b;
        let msg =()  => "Program Running Sucessfully";
        console.log(msg());

         let a = Number(prompt("Enter First Number:"));
    let b = Number(prompt("Enter Second Number:"));
    let choice = prompt("Enter Choice:+,-,*,/");

    if(choice=='+'){
        alert(add(a,b));
    }else if(choice=='-'){
        alert(sub(a,b));
    }else if(choice=='*'){
        alert(mul(a,b));
    }else if(choice=='/'){
        alert(div(a,b));
    }
    else{
        alert("Invalid Choice");
    }


    </script>
</body>

</html>
